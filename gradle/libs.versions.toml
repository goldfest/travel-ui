[versions]
kotlin = "1.9.22"
agp = "8.2.1"
compose-compiler = "1.5.10"
compose = "1.6.0"
coroutines = "1.7.3"
serialization = "1.6.0"

[libraries]
# Compose dependencies
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.8.2" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.7.5" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.7.0" }

# Kotlin dependencies
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Compose UI инструменты (правильные имена)
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }